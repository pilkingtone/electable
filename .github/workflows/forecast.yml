name: Update forecast

on:
  schedule:
    - cron: "17 */3 * * *"     # every 3 hours (UTC): results while races are counted, then news
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ["web/data/**", "data/processed/**"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m electable calibrate
      - run: python -m electable auto --backfill-days 31 --step 1
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      - name: Commit updated forecast
        run: |
          git config user.name "electable-bot"
          git config user.email "electable-bot@users.noreply.github.com"
          git add web/data data/processed config/calibrated.json
          git diff --cached --quiet || git commit -m "Update forecast $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
